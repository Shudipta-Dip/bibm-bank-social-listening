[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-social-media-analysis"
version = "0.1.0"
description = "Banking Social Media Analysis pipeline for BRAC Bank and SCB Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
listening = "listening.__main__:main"
